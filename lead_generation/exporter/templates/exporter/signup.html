<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup | Exporter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --bg: #f8fafc;
            --text: #1e293b;
            --border: #e2e8f0;
            --success: #22c55e;
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 440px;
            border: 1px solid var(--border);
        }

        h2 { font-size: 24px; font-weight: 700; color: #1e293b; margin-bottom: 30px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: 600; color: #475569; margin-bottom: 8px; }
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.2s;
        }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }

        .btn-signup {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-signup:hover { background: var(--primary-dark); }
        .btn-signup:disabled { opacity: 0.7; cursor: not-allowed; }

        .footer-link { text-align: center; margin-top: 20px; font-size: 14px; color: #64748b; }
        .footer-link a { color: var(--primary); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Signup</h2>
        
        <div id="signup-form">
            <div class="form-group">
                <label>Business Email</label>
                <input type="email" id="email" placeholder="sales@exporterA.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••••••">
            </div>

            <button class="btn-signup" id="signup-btn" onclick="handleSignup()">Sign Up</button>
        </div>

        <div class="footer-link">
            Already have an account? <a href="/exporter/login/">Log in</a>
        </div>
    </div>

    <script>
        async function handleSignup() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('signup-btn');

            if(!email || !password) {
                alert("Please fill all fields");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                const formData = new FormData();
                formData.append('email', email);
                formData.append('password', password);
                formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

                const response = await fetch('/exporter/signup/', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if(result.status === 'success') {
                    window.location.href = result.redirect;
                } else {
                    alert(result.message);
                    btn.disabled = false;
                    btn.innerText = "Sign Up";
                }
            } catch (e) {
                console.error(e);
                alert("An error occurred");
                btn.disabled = false;
                btn.innerText = "Sign Up";
            }
        }
    </script>
</body>
</html>
